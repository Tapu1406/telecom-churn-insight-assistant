[project]
name = "telecom-churn-insight-assistant"
version = "0.1.0"
description = "Evidence-grounded telecom customer churn insight assistant"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2.60",
  "langchain-ollama>=0.2.0",
  "pydantic>=2.9.0",
  "streamlit>=1.40.0",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0"]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_assistant"]
